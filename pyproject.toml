[project]
name = "querycraft-sql-assistant"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
# Vercel prioritizes this manifest over requirements.txt.
# Keep runtime pins aligned with requirements.lock; test tools stay in that file.
dependencies = [
    "aiosqlite==0.22.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "colorama==0.4.6",
    "cryptography==50.0.2",
    "distro==1.9.0",
    "fastapi==0.161.1",
    "filetype==1.2.0",
    "google-auth==2.62.0",
    "google-genai==2.33.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpcore2==2.16.0",
    "httptools==0.9.0",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "idna==3.20",
    "jsonpatch==1.36",
    "jsonpointer==3.4",
    "langchain-core==1.7.0",
    "langchain-google-genai==4.4.2",
    "langchain-protocol==0.0.20",
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-prebuilt==1.1.1",
    "langgraph-sdk==0.4.9",
    "langsmith==0.14.12",
    "opentelemetry-api==1.45.1",
    "orjson==3.13.0",
    "ormsgpack==1.13.0",
    "packaging==26.3",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "psycopg-pool==3.3.3",
    "pyasn1==0.6.4",
    "pyasn1_modules==0.4.2",
    "pycparser==3.12",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pydantic_core==2.50.1",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "sniffio==1.3.1",
    "sqlglot==30.24.0",
    "sqlite-vec==0.1.9",
    "starlette==1.9.0",
    "tenacity==9.1.4",
    "truststore==0.10.5",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "tzdata==2026.5",
    "urllib3==2.8.0",
    "uuid_utils==0.18.0",
    "uvicorn==0.54.0",
    "watchfiles==1.3.0",
    "websockets==17.3",
    "xxhash==4.0.2",
    "zstandard==0.25.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.vercel]
entrypoint = "backend.app.main:app"

name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: querycraft
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: querycraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U querycraft"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m ruff check backend data scripts evals
      - run: .venv/bin/python -m pytest -q
      - name: PostgreSQL integration tests
        run: .venv/bin/python -m pytest backend/tests/test_postgres.py -q
        env:
          RUN_POSTGRES_TESTS: "1"
          DATABASE_URL: postgresql://querycraft:ci-only-password@localhost:5432/querycraft
          DATABASE_URL_UNPOOLED: postgresql://querycraft:ci-only-password@localhost:5432/querycraft
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t querycraft:test .
